name: UI harness (scratch verification, never merged)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-harness:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a fake Claude.app
        run: |
          # bundleExists only needs the bundle dir; start() executes this
          # script (a real subprocess, so Start/Stop state flows are real).
          sudo mkdir -p "/Applications/Claude.app/Contents/MacOS"
          printf '#!/bin/sh\nsleep 300\n' | sudo tee "/Applications/Claude.app/Contents/MacOS/Claude" > /dev/null
          sudo chmod +x "/Applications/Claude.app/Contents/MacOS/Claude"
          printf '<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.anthropic.fake</string></dict></plist>' \
            | sudo tee "/Applications/Claude.app/Contents/Info.plist" > /dev/null

      - name: Seed profile list
        run: |
          ROOT="$HOME/Library/Application Support/Claude-Many"
          mkdir -p "$ROOT/Profiles/work" "$ROOT/Profiles/personal"
          cat > "$ROOT/profiles.json" <<'JSON'
          [
            {"dataDirectory":"/Users/runner/Library/Application Support/Claude-Many/Profiles/work","id":"11111111-1111-4111-8111-111111111111","label":"Work"},
            {"dataDirectory":"/Users/runner/Library/Application Support/Claude-Many/Profiles/personal","id":"22222222-2222-4222-8222-222222222222","label":"Personal"}
          ]
          JSON

      - name: Run UI harness inside the real app
        run: |
          xcodebuild -project claude-many.xcodeproj -scheme claude-many \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData test \
            -only-testing:claude-manyTests/UIHarnessTests 2>&1 | tee harness.log | tail -120

      - name: Copy artifacts
        run: |
          mkdir -p harness-out
          cp -R "$HOME/ui-harness" harness-out/ 2>/dev/null || true
          cp harness.log harness-out/ 2>/dev/null || true
          screencapture -x harness-out/desktop.png 2>/dev/null || echo "screencapture unavailable"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-harness
          path: harness-out/
